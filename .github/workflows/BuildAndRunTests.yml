name: BuildAndRunTests

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
    - src/**
    - tests/**
  pull_request:
    branches: [ "main" ]
    paths:
    - src/**
    - tests/**
    
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Iciclecreek.Lucene.Net.Temporal.slnx
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          10.0.x

    - name: Restore dependencies
      run: dotnet restore src/Iciclecreek.Lucene.Net.Temporal.slnx

    - name: Build
      run: dotnet build --no-restore src/Iciclecreek.Lucene.Net.Temporal.slnx --property WarningLevel=0
      
    - name: Test
      run: dotnet test --no-build --verbosity normal src/Iciclecreek.Lucene.Net.Temporal.slnx
